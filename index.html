<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Google Workspace-integrated Child Health Management Platform for managing children's health records, growth, and medical documents." />
    <title>Child Health Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css?v=2.4.0" />
    <link rel="stylesheet" href="css/layout.css?v=2.4.0" />
    <link rel="stylesheet" href="css/components.css?v=2.4.0" />
    <link rel="stylesheet" href="css/pages.css?v=2.4.0" />
    <link rel="stylesheet" href="css/animations.css?v=2.4.0" />
    <link rel="stylesheet" href="css/responsive.css?v=2.4.0" />
    <style>
      /* Critical preloader & route progress bar styles (rendered immediately in first paint) */
      .global-progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: linear-gradient(90deg, #2563eb, #6366f1, #06b6d4);
        box-shadow: 0 0 10px rgba(37, 99, 235, 0.6), 0 0 4px rgba(99, 102, 241, 0.4);
        z-index: 9999999;
        pointer-events: none;
        opacity: 0;
        transition: width 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
      }
      .global-progress-bar.active { opacity: 1; }

      /* Light Theme Instant Preloader */
      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Manrope", system-ui, -apple-system, sans-serif;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .initial-loader__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 38px 44px 34px;
        border-radius: 26px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.03);
        max-width: 360px;
        width: 88%;
        text-align: center;
        animation: initialPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* Typewriter Animation (from Uiverse.io by Nawsome) */
      .initial-loader__typewriter-box {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100px;
        margin-top: 10px;
        margin-bottom: 24px;
      }
      .typewriter {
        --blue: #5C86FF;
        --blue-dark: #275EFE;
        --key: #fff;
        --paper: #EEF0FD;
        --text: #D3D4EC;
        --tool: #FBC56C;
        --duration: 3s;
        position: relative;
        -webkit-animation: bounce05 var(--duration) linear infinite;
        animation: bounce05 var(--duration) linear infinite;
      }
      .typewriter .slide {
        width: 92px;
        height: 20px;
        border-radius: 3px;
        margin-left: 14px;
        transform: translateX(14px);
        background: linear-gradient(var(--blue), var(--blue-dark));
        -webkit-animation: slide05 var(--duration) ease infinite;
        animation: slide05 var(--duration) ease infinite;
      }
      .typewriter .slide:before, .typewriter .slide:after,
      .typewriter .slide i:before {
        content: "";
        position: absolute;
        background: var(--tool);
      }
      .typewriter .slide:before {
        width: 2px;
        height: 8px;
        top: 6px;
        left: 100%;
      }
      .typewriter .slide:after {
        left: 94px;
        top: 3px;
        height: 14px;
        width: 6px;
        border-radius: 3px;
      }
      .typewriter .slide i {
        display: block;
        position: absolute;
        right: 100%;
        width: 6px;
        height: 4px;
        top: 4px;
        background: var(--tool);
      }
      .typewriter .slide i:before {
        right: 100%;
        top: -2px;
        width: 4px;
        border-radius: 2px;
        height: 14px;
      }
      .typewriter .paper {
        position: absolute;
        left: 24px;
        top: -26px;
        width: 40px;
        height: 46px;
        border-radius: 5px;
        background: var(--paper);
        transform: translateY(46px);
        -webkit-animation: paper05 var(--duration) linear infinite;
        animation: paper05 var(--duration) linear infinite;
      }
      .typewriter .paper:before {
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        top: 7px;
        border-radius: 2px;
        height: 4px;
        transform: scaleY(0.8);
        background: var(--text);
        box-shadow: 0 12px 0 var(--text), 0 24px 0 var(--text), 0 36px 0 var(--text);
      }
      .typewriter .keyboard {
        width: 120px;
        height: 56px;
        margin-top: -10px;
        z-index: 1;
        position: relative;
      }
      .typewriter .keyboard:before, .typewriter .keyboard:after {
        content: "";
        position: absolute;
      }
      .typewriter .keyboard:before {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--blue), var(--blue-dark));
        transform: perspective(10px) rotateX(2deg);
        transform-origin: 50% 100%;
      }
      .typewriter .keyboard:after {
        left: 2px;
        top: 25px;
        width: 11px;
        height: 4px;
        border-radius: 2px;
        box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        -webkit-animation: keyboard05 var(--duration) linear infinite;
        animation: keyboard05 var(--duration) linear infinite;
      }

      @keyframes bounce05 {
        85%, 92%, 100% {
          transform: translateY(0);
        }
        89% {
          transform: translateY(-4px);
        }
        95% {
          transform: translateY(2px);
        }
      }

      @keyframes slide05 {
        5% {
          transform: translateX(14px);
        }
        15%, 30% {
          transform: translateX(6px);
        }
        40%, 55% {
          transform: translateX(0);
        }
        65%, 70% {
          transform: translateX(-4px);
        }
        80%, 89% {
          transform: translateX(-12px);
        }
        100% {
          transform: translateX(14px);
        }
      }

      @keyframes paper05 {
        5% {
          transform: translateY(46px);
        }
        20%, 30% {
          transform: translateY(34px);
        }
        40%, 55% {
          transform: translateY(22px);
        }
        65%, 70% {
          transform: translateY(10px);
        }
        80%, 85% {
          transform: translateY(0);
        }
        92%, 100% {
          transform: translateY(46px);
        }
      }

      @keyframes keyboard05 {
        5%, 12%, 21%, 30%, 39%, 48%, 57%, 66%, 75%, 84% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        9% {
          box-shadow: 15px 2px 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        18% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 2px 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        27% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 12px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        36% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 12px 0 var(--key), 60px 12px 0 var(--key), 68px 12px 0 var(--key), 83px 10px 0 var(--key);
        }
        45% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 2px 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        54% {
          box-shadow: 15px 0 0 var(--key), 30px 2px 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        63% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 12px 0 var(--key);
        }
        72% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 2px 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 10px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
        81% {
          box-shadow: 15px 0 0 var(--key), 30px 0 0 var(--key), 45px 0 0 var(--key), 60px 0 0 var(--key), 75px 0 0 var(--key), 90px 0 0 var(--key), 22px 10px 0 var(--key), 37px 12px 0 var(--key), 52px 10px 0 var(--key), 60px 10px 0 var(--key), 68px 10px 0 var(--key), 83px 10px 0 var(--key);
        }
      }

      .initial-loader__title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: #0f172a;
        margin: 0 0 22px 0;
      }
      .initial-loader__track {
        width: 100%;
        height: 5px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
        position: relative;
        margin-bottom: 18px;
      }
      .initial-loader__bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 25%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #6366f1, #06b6d4);
        box-shadow: 0 0 10px rgba(37, 99, 235, 0.35);
        transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .initial-loader__status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
      }
      .initial-loader__spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(37, 99, 235, 0.2);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .initial-loader--fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      @keyframes initialPop {
        from { opacity: 0; transform: translateY(12px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body data-page="dashboard">
    <!-- Top Route Progress Bar -->
    <div id="global-progress-bar" class="global-progress-bar" aria-hidden="true"></div>

    <!-- Instant Preloader (Paints immediately, eliminates white screen) -->
    <div id="initial-loader" class="initial-loader" aria-label="Loading Child Health Management Platform">
      <div class="initial-loader__card">
        <div class="initial-loader__typewriter-box">
          <div class="typewriter">
            <div class="slide"><i></i></div>
            <div class="paper"></div>
            <div class="keyboard"></div>
          </div>
        </div>
        <div class="initial-loader__title">Child Health Management</div>
        <div class="initial-loader__track">
          <div id="initial-loader-bar" class="initial-loader__bar"></div>
        </div>
        <div class="initial-loader__status">
          <span class="initial-loader__spinner"></span>
          <span id="initial-loader-text" class="initial-loader__text">Syncing...</span>
        </div>
      </div>
    </div>

    <a class="skip-link" href="#app-main">Skip to content</a>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
    <script defer src="js/bundle.js?v=2.6.0"></script>
  </body>
</html>
